name: Publish YidStore release

# Publishes a GitHub release with yidstore.zip attached when the version in
# manifest.json has no release yet:
#   - a beta (e.g. 1.8.0b1), from any branch: a pre-release;
#   - a full version (e.g. 1.8.0), only from main: the latest release.
# Runs on a push that changes manifest.json, the release notes or this file,
# or on pushing a beta tag such as v1.8.0b1. Notes: .github/release_notes.md.
# HACS / the Marketplace only offer a pre-release to users who turn on beta
# versions. Stable releases keep the manual flow (publish-assets.yml).
on:
  push:
    branches: ["**"]
    tags: ["v*b*"]
    paths:
      - "custom_components/yidstore/manifest.json"
      - ".github/release_notes.md"
      - ".github/workflows/beta-release.yml"

permissions:
  contents: write

concurrency:
  group: yidstore-beta-release
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python3 -c "import json;print(json.load(open('custom_components/yidstore/manifest.json'))['version'])")"
          tag="v${version}"
          echo "Manifest version: ${version}"
          if echo "${version}" | grep -Eq '(a|b|rc)[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "name=YidStore ${tag} (beta)" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "name=YidStore ${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "Full versions are only released from main; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; not publishing it again."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Package YidStore
        if: steps.ver.outputs.publish == 'true'
        run: |
          cd custom_components/yidstore
          zip -r __artifact__.zip .
          mv __artifact__.zip "$GITHUB_WORKSPACE/yidstore.zip"

      - name: Publish pre-release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.name }}
          body_path: .github/release_notes.md
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.ver.outputs.latest }}
          files: yidstore.zip
